<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eggGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0e6d2"/>
    </linearGradient>
    <linearGradient id="yolkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#1e3a8a"/>

  <!-- Egg shape -->
  <path
    d="M32 12
       C 42 12, 50 22, 50 34
       C 50 46, 42 54, 32 54
       C 22 54, 14 46, 14 34
       C 14 22, 22 12, 32 12 Z"
    fill="url(#eggGrad)"
    stroke="#d4c5a8"
    stroke-width="1.5"
  />

  <!-- Yolk -->
  <circle cx="32" cy="36" r="7" fill="url(#yolkGrad)"/>
  <circle cx="30" cy="34" r="2" fill="#ffffff" opacity="0.6"/>
</svg>